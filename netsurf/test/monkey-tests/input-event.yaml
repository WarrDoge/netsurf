title: input fires when text is typed into a control
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/input-event.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: no input yet
- action: click
  window: win1
  target:
    text: ab
- action: sleep-ms
  time: 300
- action: key
  window: win1
  text: c
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: input fired
- action: quit

title: keydown targets the focused control and preventDefault stops the edit
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/keydown-target.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: no key yet
- action: click
  window: win1
  target:
    text: ab
- action: sleep-ms
  time: 300
- action: key
  window: win1
  text: c
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: keydown at input
  - text-not-contains: cab
- action: quit

title: viewport size, matchMedia, screen and history
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/viewport-history.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: w=800 h=600 wide=true narrow=false land=true screen=true
  - text-contains: print=false both=true scrw=800 hist=function len=true
  - text-contains: 'state={"a":1}'
- action: quit

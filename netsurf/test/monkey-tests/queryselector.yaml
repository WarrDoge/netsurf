title: querySelector matches the selector subset scripts use
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/queryselector.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: all 32 selector checks passed
- action: quit

title: change fires when a checkbox is clicked
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/checkbox-change-event.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: no change yet
- action: click
  window: win1
  x: 18
  y: 17
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: change fired
- action: quit

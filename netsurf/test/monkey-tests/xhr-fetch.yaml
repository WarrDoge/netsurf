title: XMLHttpRequest and fetch retrieve a document
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/xhr-fetch.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: sleep-ms
  time: 1000
- action: plot-check
  window: win1
  checks:
  - text-contains: types=function,function,function
  - text-contains: form=a=1&b=two%20words
  - text-contains: xhr=fetched payload
  - text-contains: state=4
  - text-contains: ok=true
  - text-contains: fetch=fetched payload
- action: quit

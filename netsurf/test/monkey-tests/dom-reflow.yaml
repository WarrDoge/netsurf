title: box tree follows DOM changes made by script
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/dom-reflow.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: original paragraph
  - text-not-contains: appended paragraph
- action: js-exec
  window: win1
  cmd: (function () { var p = document.createElement("p"); p.appendChild(document.createTextNode("appended paragraph")); document.body.appendChild(p); })()
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: original paragraph
  - text-contains: appended paragraph
- action: js-exec
  window: win1
  cmd: document.body.removeChild(document.body.getElementsByTagName("p")[0])
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-not-contains: original paragraph
  - text-contains: appended paragraph
- action: quit

title: mouseover, mousedown and mouseup are dispatched
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/mouse-events.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-not-contains: down
- action: click
  window: win1
  target:
    text: target area
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: over
  - text-contains: down
  - text-contains: up
- action: quit

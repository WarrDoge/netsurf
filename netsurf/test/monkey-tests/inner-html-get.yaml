title: innerHTML returns the serialised subtree
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/inner-html-get.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: 'GOT[<p class="a">one &amp; two</p><br><!--note-->]'
- action: js-exec
  window: win1
  cmd: document.getElementById("src").innerHTML += "<span>appended text</span>"
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: one & two
  - text-contains: appended text
- action: quit

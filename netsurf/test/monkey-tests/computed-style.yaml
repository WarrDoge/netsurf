title: getComputedStyle reports the used values
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/computed-style.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: sleep-ms
  time: 800
- action: plot-check
  window: win1
  checks:
  - text-contains: display=block width=120px marginLeft=12px paddingTop=5px
  - text-contains: color=rgb(10, 20, 30) align=center position=relative z=3
  - text-contains: none=[none]
- action: quit

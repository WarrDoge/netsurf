title: form controls keep their form across a reflow
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/form-reflow.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: js-exec
  window: win1
  cmd: (function () { var p = document.createElement("p"); p.appendChild(document.createTextNode("appended paragraph")); document.body.appendChild(p); })()
- action: sleep-ms
  time: 800
- action: plot-check
  window: win1
  checks:
  - text-contains: appended paragraph
- action: click
  window: win1
  target:
    text: SubmitNow
- action: sleep-ms
  time: 1000
- action: block
  conditions:
  - window: win1
    status: complete
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: form target reached
- action: quit

title: focus and blur are dispatched at a text control
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/focus-blur-events.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-not-contains: focus
- action: click
  window: win1
  target:
    text: field
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: focus
  - text-not-contains: blur
- action: click
  window: win1
  target:
    text: click away here
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: blur
- action: quit

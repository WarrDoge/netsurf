title: submit fires at the form and preventDefault stops it
group: basic
steps:
- action: launch
  launch-options:
  - enable_javascript=1
- action: window-new
  tag: win1
- action: navigate
  window: win1
  url: file://${CWD}/test/js/form-submit-event.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: no submit yet
- action: click
  window: win1
  target:
    text: send it
- action: sleep-ms
  time: 500
- action: plot-check
  window: win1
  checks:
  - text-contains: submit was blocked
  - text-contains: send it
- action: quit

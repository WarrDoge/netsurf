<html>
  <head>
    <title>XMLHttpRequest and fetch test</title>
  </head>
  <body>
    <div id="log">unset</div>
    <script>
      var log = document.getElementById("log");
      function say(text) {
        log.appendChild(document.createTextNode(" " + text));
      }
      log.removeChild(log.firstChild);
      say("types=" + (typeof XMLHttpRequest) + "," + (typeof fetch) +
          "," + (typeof FormData));

      var xhr = new XMLHttpRequest();
      xhr.open("GET", "xhr-data.txt");
      xhr.onload = function () {
        say("xhr=" + xhr.responseText.replace(/\s+$/, ""));
        say("state=" + xhr.readyState);
      };
      xhr.send();

      fetch("xhr-data.txt").then(function (response) {
        say("ok=" + response.ok);
        return response.text();
      }).then(function (text) {
        say("fetch=" + text.replace(/\s+$/, ""));
      });

      var form = new FormData();
      form.append("a", "1");
      form.append("b", "two words");
      say("form=" + form.toString());
    </script>
  </body>
</html>

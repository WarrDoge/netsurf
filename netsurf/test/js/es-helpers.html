<!DOCTYPE html><html><head><title>es helpers</title>
<style>body{font-family:sans-serif;margin:8px;font-size:12px}#out{white-space:pre;padding:6px}</style>
</head><body><div id="out">running</div><script>
var r = [];
function ck(n, got, want) {
  r.push((got === want ? 'ok' : 'FAIL') + ' ' + n + ' = ' + got +
         (got === want ? '' : ' (want ' + want + ')'));
}
ck('Object.values', Object.values({a:1,b:2}).join(','), '1,2');
ck('Object.entries', Object.entries({a:1}).map(function(e){return e.join(':');}).join(','), 'a:1');
ck('Array.of', Array.of(1,2,3).join(','), '1,2,3');
ck('includes', [1,2,3].includes(2), true);
ck('includes NaN', [NaN].includes(NaN), true);
ck('includes miss', [1,2].includes(9), false);
ck('find', [1,5,9].find(function(v){return v>4;}), 5);
ck('findIndex', [1,5,9].findIndex(function(v){return v>4;}), 1);
ck('fill', [1,2,3].fill(0,1).join(','), '1,0,0');
ck('padStart', '7'.padStart(3,'0'), '007');
ck('padEnd', 'a'.padEnd(3,'.'), 'a..');
ck('trimStart', '  x '.trimStart(), 'x ');
ck('trimEnd', ' x  '.trimEnd(), ' x');

var m = new Map();
var keyObj = {};
m.set('a', 1); m.set(keyObj, 2); m.set(NaN, 3); m.set('a', 9);
ck('Map size', m.size, 3);
ck('Map get string', m.get('a'), 9);
ck('Map get object', m.get(keyObj), 2);
ck('Map get NaN', m.get(NaN), 3);
ck('Map has', m.has(keyObj), true);
ck('Map delete', m['delete'](keyObj), true);
ck('Map size after delete', m.size, 2);
ck('Map get after delete', m.get(keyObj), undefined);
ck('Map keys', m.keys().length, 2);
var seen = [];
m.forEach(function (v, k) { seen.push(String(k) + '=' + v); });
ck('Map forEach', seen.join(','), 'a=9,NaN=3');
ck('Map from pairs', new Map([['x',1],['y',2]]).get('y'), 2);
m.clear();
ck('Map clear', m.size, 0);

var s = new Set([1, 2, 2, 3]);
ck('Set dedupes', s.size, 3);
ck('Set has', s.has(2), true);
s.add(2);
ck('Set add existing', s.size, 3);
s['delete'](2);
ck('Set delete', s.has(2), false);
ck('Set values', s.values().join(','), '1,3');

var wm = new WeakMap();
var wk = {};
wm.set(wk, 'w');
ck('WeakMap', wm.get(wk), 'w');

var bad = [];
for (var i = 0; i < r.length; i++) { if (r[i].indexOf('ok ') !== 0) bad.push(r[i]); }
var d = document.getElementById('out');
while (d.firstChild) d.removeChild(d.firstChild);
d.appendChild(document.createTextNode(bad.length ? bad.join('\n') :
  ('all ' + r.length + ' es helper checks passed')));
</script></body></html>
